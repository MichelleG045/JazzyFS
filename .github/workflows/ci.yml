name: JazzyFS CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fuse libfuse2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check source/ experiments/

      - name: Check Python syntax
        run: python3 -m py_compile source/*.py experiments/*.py

      - name: Check shell syntax
        run: |
          bash -n experiments/run_all.sh
          bash -n experiments/run_experiments.sh
          bash -n experiments/run_timing_interleaved.sh
          bash -n experiments/run_seek_suppression_sweep.sh
          bash -n experiments/test_sonification.sh
          bash -n workloads/setup/setup_test_data.sh
          bash -n workloads/synthetic/*.sh
          bash -n workloads/real/*.sh

      - name: JazzyFS seek suppression smoke test
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          os.environ["JAZZYFS_MODE"] = "adaptive"
          os.environ["JAZZYFS_SOUND"] = "0"
          os.environ["JAZZYFS_RUN_LABEL"] = "ci_seek_smoke"
          os.environ["JAZZYFS_WORKLOAD"] = "seek_suppression"

          source = Path("source_data")
          source.mkdir(exist_ok=True)
          with open(source / "big.txt", "wb") as f:
              f.truncate(4 * 1024 * 1024)

          from source.jazzyfs import PassthroughRO

          fs = PassthroughRO(str(source))
          fh = fs.open("/big.txt", os.O_RDONLY)
          try:
              fs.read("/big.txt", 4096, 0, fh)
              fs.read("/big.txt", 4096, 4096, fh)
              fs.read("/big.txt", 4096, 2 * 1024 * 1024, fh)
          finally:
              fs.release("/big.txt", fh)
              fs._log_f.close()
              fs._decision_f.close()

          rows = [
              r for r in csv.DictReader(open("logs/decisions.csv", newline=""))
              if r["run_label"] == "ci_seek_smoke"
          ]
          assert rows[-2]["phase"] == "sequential"
          assert rows[-2]["prefetch"] == "1"
          assert rows[-1]["phase"] == "seek-suppressed"
          assert rows[-1]["prefetch"] == "0"
          assert int(rows[-1]["seek_delta"]) > 1024 * 1024
          PY
